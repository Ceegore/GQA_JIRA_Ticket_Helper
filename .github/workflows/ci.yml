name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The behaviour suites and the Mozilla add-on linter both need the pinned
      # dev dependencies, so the gate installs from the committed lockfile.
      - name: Install pinned dev dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Run preflight verification (includes the Mozilla add-on linter)
        run: npm run preflight

      - name: Test runtime packaging
        run: npm run build
