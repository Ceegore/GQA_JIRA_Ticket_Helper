name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run automated test suite
        run: node --test tests/shared.test.cjs tests/safety.test.cjs tests/content-contract.test.cjs tests/package.test.cjs

      - name: Run preflight verification
        run: node tools/preflight.cjs

      - name: Test runtime packaging
        run: node tools/build-runtime-package.cjs
